# Bootstrap HTTP config. Create /var/www/letsencrypt before requesting the certificate:
# certbot certonly --webroot -w /var/www/letsencrypt -d medicine.voicer-ai.pro
# certbot install --nginx --redirect --cert-name medicine.voicer-ai.pro
server {
    listen 80;
    listen [::]:80;
    server_name medicine.voicer-ai.pro;
    client_max_body_size 550m;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
