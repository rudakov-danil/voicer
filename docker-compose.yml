version: "3.9"

services:
  # ─── Инфраструктура ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: voiceiq
      POSTGRES_USER: voiceiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: voiceiq
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./monitoring/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI
      - "15692:15692"   # Prometheus metrics
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"   # Console UI
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── API Gateway (nginx) ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./services/frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - auth-service
      - admin-service
      - recorder-service
      - transcription-service
      - analytics-engine
      - scripts-service
      - dashboard-service

  # ─── Бизнес-сервисы ───────────────────────────────────────────────────────
  auth-service:
    build: ./services/auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://voiceiq:${POSTGRES_PASSWORD}@postgres:5432/voiceiq
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ORG_NAME: ${BOOTSTRAP_ORG_NAME:-Demo}
      BOOTSTRAP_ORG_SLUG: ${BOOTSTRAP_ORG_SLUG:-demo}
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-service:
    build: ./services/admin-service
    restart: unless-stopped
    ports:
      - "8007:8007"
    environment:
      DATABASE_URL: postgresql+asyncpg://voiceiq:${POSTGRES_PASSWORD}@postgres:5432/voiceiq
      AUTH_SERVICE_URL: http://auth-service:8001
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      ADMIN_PANEL_PASSWORD: ${ADMIN_PANEL_PASSWORD}
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started

  scripts-service:
    build: ./services/scripts-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://voiceiq:${POSTGRES_PASSWORD}@postgres:5432/voiceiq
      AUTH_SERVICE_URL: http://auth-service:8001
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started

  recorder-service:
    build: ./services/recorder-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://voiceiq:${POSTGRES_PASSWORD}@postgres:5432/voiceiq
      RABBITMQ_URL: amqp://voiceiq:${RABBITMQ_PASSWORD}@rabbitmq:5672/?heartbeat=0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: voiceiq-recordings
      ADMIN_SERVICE_URL: http://admin-service:8007
      AUTH_SERVICE_URL: http://auth-service:8001
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      DEEPGRAM_API_URL: ${DEEPGRAM_API_URL:-https://api.deepgram.com/v1/listen}
      DEEPGRAM_LANGUAGE: ${DEEPGRAM_LANGUAGE:-ru}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-whisper}
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  recorder-worker:
    build: ./services/recorder-service
    restart: unless-stopped
    command: python -m worker.stitch_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://voiceiq:${POSTGRES_PASSWORD}@postgres:5432/voiceiq
      RABBITMQ_URL: amqp://voiceiq:${RABBITMQ_PASSWORD}@rabbitmq:5672/?heartbeat=0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: voiceiq-recordings
      ADMIN_SERVICE_URL: http://admin-service:8007
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  transcription-service:
    build: ./services/transcription-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://voiceiq:${POSTGRES_PASSWORD}@postgres:5432/voiceiq
      RABBITMQ_URL: amqp://voiceiq:${RABBITMQ_PASSWORD}@rabbitmq:5672/?heartbeat=0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: voiceiq-recordings
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      DEEPGRAM_API_URL: ${DEEPGRAM_API_URL:-https://api.deepgram.com/v1/listen}
      DEEPGRAM_LANGUAGE: ${DEEPGRAM_LANGUAGE:-ru}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-whisper}
      LLM_SERVER_URL: ${LLM_SERVER_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_EXTRA_HEADER_NAME: ${LLM_EXTRA_HEADER_NAME}
      LLM_EXTRA_HEADER_VALUE: ${LLM_EXTRA_HEADER_VALUE}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  transcription-worker:
    build: ./services/transcription-service
    restart: unless-stopped
    command: python -m worker.transcribe_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://voiceiq:${POSTGRES_PASSWORD}@postgres:5432/voiceiq
      RABBITMQ_URL: amqp://voiceiq:${RABBITMQ_PASSWORD}@rabbitmq:5672/?heartbeat=0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: voiceiq-recordings
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      DEEPGRAM_API_URL: ${DEEPGRAM_API_URL:-https://api.deepgram.com/v1/listen}
      DEEPGRAM_LANGUAGE: ${DEEPGRAM_LANGUAGE:-ru}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-whisper}
      LLM_SERVER_URL: ${LLM_SERVER_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_EXTRA_HEADER_NAME: ${LLM_EXTRA_HEADER_NAME}
      LLM_EXTRA_HEADER_VALUE: ${LLM_EXTRA_HEADER_VALUE}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  diarize-worker:
    build: ./services/transcription-service
    restart: unless-stopped
    command: python -m worker.diarize_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://voiceiq:${POSTGRES_PASSWORD}@postgres:5432/voiceiq
      RABBITMQ_URL: amqp://voiceiq:${RABBITMQ_PASSWORD}@rabbitmq:5672/?heartbeat=0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: voiceiq-recordings
      LLM_SERVER_URL: ${LLM_SERVER_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_EXTRA_HEADER_NAME: ${LLM_EXTRA_HEADER_NAME}
      LLM_EXTRA_HEADER_VALUE: ${LLM_EXTRA_HEADER_VALUE}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME}
      ADMIN_SERVICE_URL: http://admin-service:8007
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  analytics-engine:
    build: ./services/analytics-engine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://voiceiq:${POSTGRES_PASSWORD}@postgres:5432/voiceiq
      RABBITMQ_URL: amqp://voiceiq:${RABBITMQ_PASSWORD}@rabbitmq:5672/?heartbeat=0
      LLM_SERVER_URL: ${LLM_SERVER_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_EXTRA_HEADER_NAME: ${LLM_EXTRA_HEADER_NAME}
      LLM_EXTRA_HEADER_VALUE: ${LLM_EXTRA_HEADER_VALUE}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME}
      SCRIPTS_SERVICE_URL: http://scripts-service:8005
      TRANSCRIPTION_SERVICE_URL: http://transcription-service:8003
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  analytics-worker:
    build: ./services/analytics-engine
    restart: unless-stopped
    command: python -m worker.analyze_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://voiceiq:${POSTGRES_PASSWORD}@postgres:5432/voiceiq
      RABBITMQ_URL: amqp://voiceiq:${RABBITMQ_PASSWORD}@rabbitmq:5672/?heartbeat=0
      LLM_SERVER_URL: ${LLM_SERVER_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_EXTRA_HEADER_NAME: ${LLM_EXTRA_HEADER_NAME}
      LLM_EXTRA_HEADER_VALUE: ${LLM_EXTRA_HEADER_VALUE}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME}
      LLM_SCRIPT_TIMEOUT: ${LLM_SCRIPT_TIMEOUT}
      LLM_GENERAL_TIMEOUT: ${LLM_GENERAL_TIMEOUT}
      SCRIPTS_SERVICE_URL: http://scripts-service:8005
      TRANSCRIPTION_SERVICE_URL: http://transcription-service:8003
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  dashboard-service:
    build: ./services/dashboard-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://voiceiq:${POSTGRES_PASSWORD}@postgres:5432/voiceiq
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://voiceiq:${RABBITMQ_PASSWORD}@rabbitmq:5672/?heartbeat=0
      AUTH_SERVICE_URL: http://auth-service:8001
      ADMIN_SERVICE_URL: http://admin-service:8007
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  dashboard-worker:
    build: ./services/dashboard-service
    restart: unless-stopped
    command: python -m worker.cache_invalidation_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://voiceiq:${POSTGRES_PASSWORD}@postgres:5432/voiceiq
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://voiceiq:${RABBITMQ_PASSWORD}@rabbitmq:5672/?heartbeat=0
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ─── Мониторинг ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - node-exporter

  node-exporter:
    image: prom/node-exporter:v1.8.1
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:10.4.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  prometheus_data:
  grafana_data:
