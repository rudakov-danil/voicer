<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Splitter — истории из стендапа</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --border: #e3e6ea; --text: #1a1d21;
    --muted: #6b7280; --accent: #2f6df6; --accent-soft: #eaf1ff;
    --ok: #1a8a5a; --err: #c0392b; --warn: #b5730d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --card: #1c1f24; --border: #2c3138; --text: #e8eaed;
      --muted: #9aa1ab; --accent: #5b8dff; --accent-soft: #1e2a44;
      --ok: #3ecf8e; --err: #ff6b5b; --warn: #e0a33a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 18px 24px; border-bottom: 1px solid var(--border); background: var(--card);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 650; }
  .sub { color: var(--muted); font-size: 12.5px; }
  .layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; padding: 20px 24px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .card + .card { margin-top: 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; }
  #drop {
    border: 1.5px dashed var(--border); border-radius: 9px; padding: 24px 14px;
    text-align: center; color: var(--muted); cursor: pointer; transition: .15s;
  }
  #drop:hover, #drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
  button {
    font: inherit; border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 7px; padding: 6px 12px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { color: #fff; opacity: .9; }
  .job {
    padding: 10px 12px; border-radius: 8px; cursor: pointer; border: 1px solid transparent;
    display: flex; flex-direction: column; gap: 3px;
  }
  .job:hover { background: var(--accent-soft); }
  .job.active { border-color: var(--accent); background: var(--accent-soft); }
  .job-name { font-weight: 550; word-break: break-word; }
  .job-meta { font-size: 12px; color: var(--muted); }
  .badge {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 20px;
    background: var(--accent-soft); color: var(--accent);
  }
  .badge.done { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .badge.failed { background: color-mix(in srgb, var(--err) 15%, transparent); color: var(--err); }
  .story { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
  .story-head { padding: 13px 15px; background: var(--accent-soft); }
  .story-title { font-size: 15px; font-weight: 600; margin: 0 0 3px; }
  .story-title-ru { color: var(--muted); font-size: 13px; }
  .story-sum { margin-top: 7px; font-size: 13px; }
  .story-body { padding: 13px 15px; }
  audio { width: 100%; margin: 10px 0 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  td { padding: 5px 8px; vertical-align: top; border-top: 1px solid var(--border); }
  tr:first-child td { border-top: none; }
  td.tc {
    width: 62px; white-space: nowrap; color: var(--accent); cursor: pointer;
    font-variant-numeric: tabular-nums; font-size: 12.5px;
  }
  td.tc:hover { text-decoration: underline; }
  td.ru { color: var(--muted); border-left: 1px solid var(--border); }
  .empty { color: var(--muted); text-align: center; padding: 40px 12px; }
  .err { color: var(--err); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }
  progress { width: 100%; height: 5px; margin-top: 10px; }
</style>
</head>
<body>
<header>
  <h1>Story Splitter</h1>
  <span class="sub">стендап → расшифровка с таймкодами → истории с аудио</span>
  <span class="spacer"></span>
  <span class="sub" id="health"></span>
</header>

<div class="layout">
  <div>
    <div class="card">
      <h2>Загрузка</h2>
      <div id="drop">
        Перетащи аудио сюда<br><span class="sub">или нажми для выбора файла</span>
      </div>
      <input type="file" id="file" accept="audio/*,video/mp4,.m4a,.opus,.webm" hidden>
      <div id="upStatus" class="sub" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <h2>Задачи</h2>
      <div id="jobs"><div class="empty">Пока пусто</div></div>
    </div>
  </div>

  <div class="card" id="detail">
    <div class="empty">Выбери задачу слева или загрузи аудио</div>
  </div>
</div>

<script>
const STATUS_LABEL = {
  queued: 'в очереди', transcribing: 'распознавание', segmenting: 'поиск историй',
  cutting: 'нарезка аудио', translating: 'перевод', done: 'готово', failed: 'ошибка',
};
const ACTIVE = ['queued', 'transcribing', 'segmenting', 'cutting', 'translating'];

let currentId = null;
let pollTimer = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => (s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || `HTTP ${res.status}`);
  }
  return res.status === 204 ? null : res.json();
}

// gpt://<folder>/<model>/<version> — версия в конце, поэтому её отбрасываем
function shortModel(id) {
  const parts = (id || '').replace(/^\w+:\/\//, '').split('/').filter(Boolean);
  const meaningful = parts.filter((p) => !/^(latest|rc|deprecated)$/.test(p));
  return meaningful.length > 1 ? meaningful[meaningful.length - 1] : (meaningful[0] || id || '');
}

async function loadHealth() {
  try {
    const h = await api('/api/health');
    const warn = [];
    if (!h.asr_configured) warn.push('нет ключа Deepgram');
    if (!h.llm_configured) warn.push('не настроена LLM');
    $('health').innerHTML = warn.length
      ? `<span class="err">${esc(warn.join(' · '))}</span>`
      : `ASR ${esc(h.asr_model)} · ${esc(h.asr_language)} · LLM ${esc(shortModel(h.llm_model))}`;
  } catch (e) { $('health').textContent = ''; }
}

async function loadJobs() {
  const jobs = await api('/api/jobs');
  const box = $('jobs');
  if (!jobs.length) { box.innerHTML = '<div class="empty">Пока пусто</div>'; return; }
  box.innerHTML = jobs.map((j) => {
    const cls = j.status === 'done' ? 'done' : j.status === 'failed' ? 'failed' : '';
    return `<div class="job ${j.id === currentId ? 'active' : ''}" data-id="${j.id}">
      <div class="job-name">${esc(j.filename)}</div>
      <div class="job-meta">
        <span class="badge ${cls}">${esc(STATUS_LABEL[j.status] || j.status)}</span>
        ${j.stories_count ? ` · историй: ${j.stories_count}` : ''}
      </div>
    </div>`;
  }).join('');
  box.querySelectorAll('.job').forEach((el) => {
    el.onclick = () => selectJob(el.dataset.id);
  });
}

async function selectJob(id) {
  currentId = id;
  await loadJobs();
  await renderDetail();
}

function fmt(sec) {
  const t = Math.floor(sec || 0);
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`
           : `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

async function renderDetail() {
  if (!currentId) return;
  const job = await api(`/api/jobs/${currentId}`);
  const box = $('detail');
  const busy = ACTIVE.includes(job.status);

  let head = `<div class="row">
      <h2 style="margin:0">${esc(job.filename)}</h2>
      <span class="badge ${job.status === 'done' ? 'done' : job.status === 'failed' ? 'failed' : ''}">
        ${esc(STATUS_LABEL[job.status] || job.status)}</span>
      <span class="spacer"></span>
      ${job.status === 'done' ? `<button class="primary" onclick="window.open('/api/jobs/${job.id}/bundle')">Скачать для отправки</button>` : ''}
      ${job.status === 'done' ? `<button onclick="window.open('/api/jobs/${job.id}/export')">JSON</button>` : ''}
      ${!busy ? `<button data-act="retry">Пересчитать</button>` : ''}
      <button data-act="del">Удалить</button>
    </div>`;

  const meta = [];
  if (job.language) meta.push(`язык: ${esc(job.language)}`);
  if (job.duration_sec) meta.push(`длительность: ${fmt(job.duration_sec)}`);
  if (job.transcript?.length) meta.push(`сегментов: ${job.transcript.length}`);
  if (meta.length) head += `<div class="sub" style="margin-top:6px">${meta.join(' · ')}</div>`;

  if (job.stage_note) head += `<div class="sub" style="margin-top:8px">${esc(job.stage_note)}</div>`;
  if (busy) head += '<progress></progress>';
  if (job.error) head += `<div class="err" style="margin-top:10px">${esc(job.error)}</div>`;

  const stories = job.stories.map((s, i) => `
    <div class="story">
      <div class="story-head">
        <div class="story-title">${i + 1}. ${esc(s.title)}</div>
        ${s.title_ru ? `<div class="story-title-ru">${esc(s.title_ru)}</div>` : ''}
        <div class="sub" style="margin-top:5px">${esc(s.duration_label)}</div>
        ${s.summary_ru ? `<div class="story-sum">${esc(s.summary_ru)}</div>` : ''}
      </div>
      <div class="story-body">
        ${s.audio_url ? `<audio controls preload="none" id="a-${s.id}" src="${s.audio_url}"></audio>` : ''}
        <table>${s.segments.map((seg) => `
          <tr>
            <td class="tc" data-player="a-${s.id}" data-at="${(seg.start - s.start_sec).toFixed(2)}">${fmt(seg.start)}</td>
            <td>${esc(seg.text)}</td>
            ${seg.text_ru ? `<td class="ru">${esc(seg.text_ru)}</td>` : ''}
          </tr>`).join('')}
        </table>
      </div>
    </div>`).join('');

  box.innerHTML = head + (stories
    ? `<div style="margin-top:16px">${stories}</div>`
    : (busy ? '' : '<div class="empty">Историй нет</div>'));

  box.querySelector('[data-act="del"]')?.addEventListener('click', async () => {
    if (!confirm('Удалить задачу вместе с аудио и нарезкой?')) return;
    await api(`/api/jobs/${currentId}`, { method: 'DELETE' });
    currentId = null;
    $('detail').innerHTML = '<div class="empty">Выбери задачу слева или загрузи аудио</div>';
    await loadJobs();
  });
  box.querySelector('[data-act="retry"]')?.addEventListener('click', async () => {
    await api(`/api/jobs/${currentId}/retry`, { method: 'POST' });
    await renderDetail();
    schedulePoll();
  });
  // Клик по таймкоду перематывает плеер этой истории на нужное место
  box.querySelectorAll('td.tc').forEach((td) => {
    td.onclick = () => {
      const player = $(td.dataset.player);
      if (!player) return;
      player.currentTime = Math.max(0, parseFloat(td.dataset.at));
      player.play();
    };
  });

  if (busy) schedulePoll();
}

function schedulePoll() {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    await loadJobs();
    await renderDetail();
  }, 4000);
}

async function upload(file) {
  $('upStatus').textContent = `Загружаю ${file.name}…`;
  const form = new FormData();
  form.append('file', file);
  try {
    const job = await api('/api/jobs', { method: 'POST', body: form });
    $('upStatus').textContent = 'Принято, обработка запущена';
    await selectJob(job.id);
    schedulePoll();
  } catch (e) {
    $('upStatus').innerHTML = `<span class="err">${esc(e.message)}</span>`;
  }
}

$('drop').onclick = () => $('file').click();
$('file').onchange = (e) => { if (e.target.files[0]) upload(e.target.files[0]); };
['dragenter', 'dragover'].forEach((ev) => $('drop').addEventListener(ev, (e) => {
  e.preventDefault(); $('drop').classList.add('over');
}));
['dragleave', 'drop'].forEach((ev) => $('drop').addEventListener(ev, (e) => {
  e.preventDefault(); $('drop').classList.remove('over');
}));
$('drop').addEventListener('drop', (e) => {
  const f = e.dataTransfer.files[0];
  if (f) upload(f);
});

loadHealth();
loadJobs();
</script>
</body>
</html>
