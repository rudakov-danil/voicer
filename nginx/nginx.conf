upstream auth_service        { server auth-service:8001; }
upstream admin_service       { server admin-service:8007; }
upstream recorder_service    { server recorder-service:8002; }
upstream transcription_service { server transcription-service:8003; }
upstream analytics_engine    { server analytics-engine:8004; }
upstream scripts_service     { server scripts-service:8005; }
upstream dashboard_service   { server dashboard-service:8006; }

server {
    listen 80;
    server_name _;

    client_max_body_size 512M;
    proxy_read_timeout   1800s;
    proxy_send_timeout   1800s;

    # ── Общие proxy-заголовки ────────────────────────────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Auth service ─────────────────────────────────────────────────────────
    location /api/v1/auth/ {
        proxy_pass http://auth_service;
    }
    location /api/v1/users/ {
        proxy_pass http://auth_service;
    }

    # ── Admin service ────────────────────────────────────────────────────────
    location /api/v1/admin/ {
        proxy_pass http://admin_service;
    }

    # ── Recorder service ─────────────────────────────────────────────────────
    location /api/v1/recorder/ {
        proxy_pass http://recorder_service;
    }

    # ── Transcription service ────────────────────────────────────────────────
    location /api/v1/transcription/ {
        proxy_pass http://transcription_service;
    }

    # ── Analytics engine ─────────────────────────────────────────────────────
    location /api/v1/analytics/ {
        proxy_pass http://analytics_engine;
    }

    # ── Scripts service ──────────────────────────────────────────────────────
    location /api/v1/scripts/ {
        proxy_pass http://scripts_service;
    }

    # ── Dashboard service ────────────────────────────────────────────────────
    location /api/v1/dashboard/ {
        proxy_pass http://dashboard_service;
    }

    # ── Swagger UI для каждого сервиса (для разработки) ──────────────────────
    location /docs/auth/         { proxy_pass http://auth_service/docs; }
    location /docs/admin/        { proxy_pass http://admin_service/docs; }
    location /docs/recorder/     { proxy_pass http://recorder_service/docs; }
    location /docs/transcription/ { proxy_pass http://transcription_service/docs; }
    location /docs/analytics/    { proxy_pass http://analytics_engine/docs; }
    location /docs/scripts/      { proxy_pass http://scripts_service/docs; }
    location /docs/dashboard/    { proxy_pass http://dashboard_service/docs; }

    # ── Health check ─────────────────────────────────────────────────────────
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ── Frontend (React SPA) ──────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Не кешировать HTML — браузер всегда берёт свежую версию
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }

        # JS/CSS с хешем — кешировать надолго
        location ~* \.(js|css)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
